name: Build and release

on:
  push:
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows-build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
          cache-dependency-path: tencent-game-audit/go.mod
      - name: Test
        working-directory: tencent-game-audit
        run: go test -count=1 ./...
      - name: Vet
        working-directory: tencent-game-audit
        run: go vet ./...
      - name: Build portable executable
        working-directory: tencent-game-audit
        shell: pwsh
        run: |
          $env:GOOS = 'windows'
          $env:GOARCH = 'amd64'
          $env:CGO_ENABLED = '0'
          go build -trimpath -ldflags='-s -w' -o Tencent-Game-Audit.exe .
          if ($LASTEXITCODE -ne 0) { throw 'Build failed' }
          New-Item -ItemType Directory -Force ../dist | Out-Null
          Copy-Item Tencent-Game-Audit.exe ../dist/
          Copy-Item portable-readme.txt ../dist/README.txt
          Compress-Archive -Path ../dist/* -DestinationPath ../Tencent-Game-Audit-Windows-x64.zip -Force
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Tencent-Game-Audit-Windows-x64
          path: Tencent-Game-Audit-Windows-x64.zip
      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: Tencent-Game-Audit-Windows-x64.zip
