name: Build and release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Test and package Windows x64
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
          cache-dependency-path: tencent-game-audit/go.mod
      - name: Test
        working-directory: tencent-game-audit
        run: go test -count=1 ./...
      - name: Vet
        working-directory: tencent-game-audit
        run: go vet ./...
      - name: Build and package
        shell: pwsh
        working-directory: tencent-game-audit
        run: |
          $ErrorActionPreference = 'Stop'
          $env:GOOS = 'windows'
          $env:GOARCH = 'amd64'
          $env:CGO_ENABLED = '0'
          go build -trimpath -ldflags='-s -w' -o Tencent-Game-Audit.exe .
          New-Item -ItemType Directory -Force ../dist | Out-Null
          Copy-Item Tencent-Game-Audit.exe ../dist/
          Copy-Item portable-readme.txt ../dist/README.txt
          Compress-Archive -Path ../dist/Tencent-Game-Audit.exe, ../dist/README.txt -DestinationPath ../Tencent-Game-Audit-Windows-x64.zip -Force
          $hash = (Get-FileHash ../Tencent-Game-Audit-Windows-x64.zip -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  Tencent-Game-Audit-Windows-x64.zip" | Set-Content ../SHA256SUMS.txt -Encoding ascii
      - name: Upload release files
        uses: actions/upload-artifact@v4
        with:
          name: windows-x64-release
          path: |
            Tencent-Game-Audit-Windows-x64.zip
            SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download release files
        uses: actions/download-artifact@v4
        with:
          name: windows-x64-release
          path: dist
      - name: Publish release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          files: |
            dist/Tencent-Game-Audit-Windows-x64.zip
            dist/SHA256SUMS.txt
