name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test and vet
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.23.x'
          cache-dependency-path: tencent-game-audit/go.mod
      - name: Test
        working-directory: tencent-game-audit
        run: go test -count=1 ./...
      - name: Vet
        working-directory: tencent-game-audit
        run: go vet ./...
      - name: Build Windows x64
        working-directory: tencent-game-audit
        shell: pwsh
        run: |
          $env:GOOS = 'windows'
          $env:GOARCH = 'amd64'
          $env:CGO_ENABLED = '0'
          go build -trimpath -ldflags='-s -w' -o Tencent-Game-Audit.exe .
      - name: Set up Rust
        uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          rust-src-dir: rust-core
      - name: Check Rust formatting
        working-directory: rust-core
        run: cargo fmt --all -- --check
      - name: Run Rust tests
        working-directory: rust-core
        run: cargo test --locked
      - name: Run Rust Clippy
        working-directory: rust-core
        run: cargo clippy --locked --all-targets -- -D warnings
