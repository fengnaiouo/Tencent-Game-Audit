name: Game compatibility report
description: Report a game, launcher, region, or installation-path compatibility issue.
title: "compatibility: "
labels: [game-compatibility, needs-triage]
body:
  - type: markdown
    attributes:
      value: "Only share sanitized details. Do not upload full audit reports, account data, credentials, or private samples."
  - type: input
    id: game
    attributes:
      label: Game title
    validations:
      required: true
  - type: input
    id: edition
    attributes:
      label: Region / edition / publisher
      description: State only what you can verify; do not infer corporate ownership.
  - type: input
    id: version
    attributes:
      label: Game and launcher version
  - type: input
    id: os
    attributes:
      label: Windows version and architecture
      placeholder: Windows 11 24H2 x64
    validations:
      required: true
  - type: input
    id: scanner
    attributes:
      label: Tencent Game Audit version
      placeholder: v0.9.0
    validations:
      required: true
  - type: textarea
    id: install
    attributes:
      label: Sanitized install-path shape
      description: Replace usernames, drive labels, and personal folder names (for example, C:\\Games\\Example).
  - type: textarea
    id: behavior
    attributes:
      label: Expected and actual behavior
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Sanitized evidence
      description: Include finding IDs and minimal excerpts only. Never attach an unredacted JSON/HTML report.
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I have removed usernames, device identifiers, credentials, private paths, and personal information.
          required: true
